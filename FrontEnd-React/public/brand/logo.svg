<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Book Pages / Wings Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Digital Pulse & Glow Gradient -->
    <linearGradient id="accentPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Gold / Amber Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Premium Drop Shadows -->
    <filter id="shadowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E3A8A" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Icon Badge -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#bgGrad)" filter="url(#shadowIcon)"/>

  <!-- Subtle High-Tech Concentric Grid Background Lines -->
  <path d="M 48 200 C 180 140, 332 140, 464 200" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" fill="none"/>
  <path d="M 48 312 C 180 252, 332 252, 464 312" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" fill="none"/>
  <circle cx="390" cy="118" r="44" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" fill="none"/>
  <circle cx="122" cy="394" r="54" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" fill="none"/>

  <!-- Main Symbol Group (Centered, balanced) -->
  <g transform="translate(0, -6)" filter="url(#innerGlow)">
    
    <!-- 1. Graduation Cap Mortarboard (Top Authority & Academic Excellence) -->
    <!-- Diamond Top -->
    <path d="M 256 126 L 388 184 L 256 242 L 124 184 Z" fill="#FFFFFF"/>
    
    <!-- Isometric Thickness / Edge Shadow -->
    <path d="M 124 184 L 124 196 L 256 254 L 388 196 L 388 184 L 256 242 Z" fill="#CBD5E1"/>

    <!-- Mortarboard Skullcap Arch -->
    <path d="M 174 206 L 174 246 C 174 274 338 274 338 246 L 338 206 L 256 242 Z" fill="#F1F5F9" opacity="0.95"/>

    <!-- 2. Stylized Open Book & Upward Growth Pulse (Holistic Knowledge & Cloud Intelligence) -->
    <!-- Left Page Wing -->
    <path d="M 136 292 C 184 266 226 280 244 300 L 244 374 C 226 354 184 340 136 366 Z" fill="url(#bookGrad)"/>
    
    <!-- Right Page Wing -->
    <path d="M 376 292 C 328 266 286 280 268 300 L 268 374 C 286 354 328 340 376 366 Z" fill="url(#bookGrad)"/>

    <!-- Dynamic Central Spine & Growth Pulse Wave (Vibrant Cyan-Emerald) -->
    <path d="M 148 302 C 190 278 230 292 248 312 C 253 317 259 317 264 312 C 282 292 322 278 364 302 L 364 322 C 322 298 282 312 264 332 C 259 337 253 337 248 332 C 230 312 190 298 148 322 Z" fill="url(#accentPulse)"/>

    <!-- Central Tech Core / Vertical Spine Pin -->
    <rect x="251" y="278" width="10" height="106" rx="5" fill="#FFFFFF"/>

    <!-- 3. Dynamic Tassel & Educational Spark / Innovation Star -->
    <!-- Graduation Cap Tassel Line -->
    <path d="M 388 184 C 404 220 410 248 404 272" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" stroke-dasharray="1 7"/>
    
    <!-- Golden Achievement Star / Tassel Beacon -->
    <circle cx="404" cy="282" r="12" fill="url(#sparkGrad)" filter="url(#sparkGlow)"/>
    <circle cx="404" cy="282" r="6" fill="#FFFFFF"/>

    <!-- Innovation Digital Sparkle Star (Top Right) -->
    <path d="M 380 120 Q 380 138 398 138 Q 380 138 380 156 Q 380 138 362 138 Q 380 138 380 120 Z" fill="url(#sparkGrad)" filter="url(#sparkGlow)"/>

  </g>
</svg>